name: test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install build
      - run: python -m build
      - name: Server starts and lists its tools
        run: |
          python -m pip install dist/*.whl
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}' \
            '{"jsonrpc":"2.0","method":"notifications/initialized"}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' \
            | IMMPORT_METRICS_ENABLED=false timeout 60 immport-mcp | grep -q '"search_studies"'
      - name: Tool API paths exist in the ImmPort OpenAPI spec
        run: python scripts/check_api_paths.py --spec-url https://www.immport.org/data/query/v3/api-docs
