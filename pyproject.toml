[project]
name = "immport-mcp"
# The public export (scripts/export_public.py) sets this from VERSION on each release.
version = "1.4.0"
description = "MCP server for ImmPort, the NIAID immunology data repository: search studies, fetch study data, assay results and files"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
keywords = ["immport", "immunology", "mcp", "model-context-protocol", "niaid", "claude"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "fastmcp>=2.0",
    "httpx>=0.27",
    "pydantic-settings>=2.0",
    "tenacity>=8.0",
    "cachetools>=5.0",
    "tzdata>=2024.1",
]

[project.urls]
Homepage = "https://www.immport.org"
Repository = "https://github.com/ImmPortDB/immport-mcp"
Issues = "https://github.com/ImmPortDB/immport-mcp/issues"

[project.scripts]
immport-mcp = "immport_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["immport_mcp"]
